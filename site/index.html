<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo-buildkite</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #060a18; color: #e6edf3;
         font: 16px/1.55 "IBM Plex Sans", system-ui, sans-serif; }
  main { padding: 32px 36px; border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
         background: rgba(18,24,40,.72); box-shadow: 0 30px 80px rgba(0,0,0,.45); max-width: 560px; }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; }
  h1 span { background: linear-gradient(90deg, hsl(311 60% 76%), hsl(258 90% 82%)); -webkit-background-clip: text; color: transparent; }
  p { margin: 0 0 18px; color: #b7c2cf; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; }
  dt { color: #8b98a8; } dd { margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Built on Buildkite. <span>Deployed by PipeMesh.</span></h1>
  <p>This page is the artifact of one revision flowing through a PipeMesh pipeline whose build stage is a Buildkite pipeline.</p>
  <dl>
    <dt>revision</dt><dd title="@SHA@">@SHORT@</dd>
    <dt>buildkite build</dt><dd>#@BUILD@</dd>
    <dt>pipemesh run</dt><dd>@RUN@</dd>
    <dt>built at</dt><dd>@AT@</dd>
  </dl>
</main>
</body>
</html>
